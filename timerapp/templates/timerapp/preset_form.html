{% extends "timerapp/base.html" %}
{% block nav %}
  <a href="{% url 'control' studio.slug %}">{{ studio.name }}</a>
  <a href="{% url 'preset_list' studio.slug %}">Presets</a>
{% endblock %}
{% block content %}
<h1>{% if preset %}Edit{% else %}New{% endif %} preset</h1>
<form method="post" novalidate>{% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a class="btn" href="{% url 'preset_list' studio.slug %}">Cancel</a>
</form>
{% endblock %}
