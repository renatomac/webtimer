{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ studio.name }} timer</title>
<link rel="stylesheet" href="{% static 'timerapp/style.css' %}">
</head>
<body class="display coaching-display" data-status="ready">
{% if studio.logo %}<img class="watermark" src="{{ studio.logo.url }}" alt="">{% endif %}
<header class="timer-toolbar">
  <div><p class="timer-kicker">{{ studio.name }}</p><h1>Mat timer</h1></div>
  <div class="timer-tools"><button id="sound" type="button" aria-pressed="false">Sound off</button><button id="fullscreen" type="button">Fullscreen</button><button id="wake-lock" type="button" aria-pressed="false">Keep awake</button></div>
</header>
<main class="timer-stage">
  <div class="wall-clock"><span id="date"></span><strong id="time"></strong></div>
  <div class="status phase-badge" id="status"></div>
  <div class="round-indicator" id="round"></div>
  <div class="round-pills" id="round-pills" aria-label="Round progress"></div>
  <div class="digits" id="digits">--:--</div>
  <div class="phase" id="phase"></div>
  <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
</main>
{{ config|json_script:"display-config" }}
<script src="{% static 'timerapp/timer.js' %}"></script>
<script src="{% static 'timerapp/display.js' %}"></script>
</body>
</html>
